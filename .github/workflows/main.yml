name: etl workflow

on:
  push:
    branches:
      - main

jobs:

  extract_data_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print extract_data
        run: python extract_data.py

  transform_data_workflow:
    runs-on: ubuntu-latest
    needs: extract_data_workflow
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print transform_data
        run: python transform_data.py

  load_data_workflow:
    runs-on: ubuntu-latest
    needs: transform_data_workflow
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print load_data
        run: python load_data.py