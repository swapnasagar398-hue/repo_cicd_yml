name: workflow jobs

on:
  push:
    branches:
      - main

jobs:

  job1:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job1
        run: echo 'welcome to job1'

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job2
        run: echo 'welcome to job2'

  job3:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job3
        run: echo 'welcome to job3'

  job4:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job4
        run: echo 'welcome to job4'

  job5:
    runs-on: ubuntu-latest
    needs: job3
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job5
        run: echo 'welcome to job5'

  job6:
    runs-on: ubuntu-latest
    needs: [job4, job5]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: print job6
        run: echo 'welcome to job6'